            </div>
          )}
        </article>
      </main>
    </>
  );
}

const DxAutocompleteInput = React.memo(function DxAutocompleteInput({ placeholder, onChange }) {
  const [query, setQuery] = useState('');
  const [showDrop, setShowDrop] = useState(false);
  const [focusedIdx, setFocusedIdx] = useState(-1);
  const [selectedDx, setSelectedDx] = useState(null);
  const acRef = useRef(null);

  const filtered = useMemo(() => {
    if (!query.trim() || selectedDx) return [];
    const q = query.toLowerCase();
    return L.DX_DATABASE.filter(d => d.code.toLowerCase().includes(q) || d.name.toLowerCase().includes(q)).slice(0, 9);
  }, [query, selectedDx]);

  useEffect(() => {
    const handler = (e) => { if (acRef.current && !acRef.current.contains(e.target)) setShowDrop(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const select = useCallback((dx) => {
    setSelectedDx(dx);
    setQuery(`${dx.code} — ${dx.name}`);
    setShowDrop(false);
    setFocusedIdx(-1);
    onChange(`${dx.code} — ${dx.name}`);
  }, [onChange]);

  const clear = useCallback(() => {
    setSelectedDx(null);
    setQuery('');
    setShowDrop(false);
    onChange('');
  }, [onChange]);

  return (
    <div className="dx-ac-wrap" ref={acRef}>
      <div style={{position:'relative',display:'flex',alignItems:'center'}}>
        <input
          className="input"
          type="text"
          placeholder={placeholder || 'Search by name or ICD-10 code…'}
          value={query}
          autoComplete="off"
          spellCheck={false}
          style={selectedDx ? {paddingRight:32,background:'var(--accent-soft)',borderColor:'var(--accent)',fontWeight:500} : {}}
          readOnly={!!selectedDx}
          onFocus={() => { if (!selectedDx && filtered.length) setShowDrop(true); }}
          onChange={e => { setQuery(e.target.value); setShowDrop(true); setFocusedIdx(-1); }}
          onKeyDown={e => {
            if (e.key === 'Escape') { setShowDrop(false); return; }
            if (!showDrop || !filtered.length) return;
            if (e.key === 'ArrowDown') { e.preventDefault(); setFocusedIdx(i => Math.min(i+1, filtered.length-1)); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); setFocusedIdx(i => Math.max(i-1, 0)); }
            else if (e.key === 'Enter' && focusedIdx >= 0) { e.preventDefault(); select(filtered[focusedIdx]); }
          }}
        />
        {selectedDx && (
          <button
            type="button"
            onClick={clear}
            title="Clear selection"
            style={{position:'absolute',right:8,background:'none',border:'none',cursor:'pointer',color:'var(--accent)',fontSize:15,lineHeight:1,padding:'2px 4px',borderRadius:4,display:'flex',alignItems:'center'}}
          >✕</button>
        )}
      </div>
      {showDrop && filtered.length > 0 && (
        <div className="dx-ac-drop">
          {filtered.map((dx, i) => (
            <div
              key={dx.code}
              className={`dx-ac-item${i === focusedIdx ? ' focused' : ''}`}
              onMouseDown={e => { e.preventDefault(); select(dx); }}
            >
              <span className="dx-code">{dx.code}</span>
              <span className="dx-name">{dx.name}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
});

function IntakeTab({ apiKeyRef, showToast, onNeedKey, screeningLines, safetyPlanItems, privacy }) {
  const [subject, setSubject] = useState('Client');
  const [note, setNote] = useState('');
  const [loading, setLoading] = useState(false);
  const [flags, setFlags] = useState(null);
  const [sessionDate, setSessionDate] = useState('');
  const [sessionStart, setSessionStart] = useState('');
  const [sessionEnd, setSessionEnd] = useState('');
  const sessionDuration = useMemo(() => {
    if (!sessionStart || !sessionEnd) return null;
    const [sh, sm] = sessionStart.split(':').map(Number);
    const [eh, em] = sessionEnd.split(':').map(Number);
    const diff = (eh * 60 + em) - (sh * 60 + sm);
    return diff > 0 ? diff : null;
  }, [sessionStart, sessionEnd]);
  const [symptoms, setSymptoms] = useState('');
  const [onset, setOnset] = useState('');
  const [severity, setSeverity] = useState('');
  const [stressors, setStressors] = useState('');
  const [occ, setOcc] = useState({ status: '', detail: '' });
  const [soc, setSoc] = useState({ status: '', detail: '' });
  const [adl, setAdl] = useState({ status: '', detail: '' });
  const [si, setSi] = useState({ status: '', detail: '' });
  const [hi, setHi] = useState({ status: '', detail: '' });
  const [selfHarm, setSelfHarm] = useState({ status: '', detail: '' });
  const [safetyPlan, setSafetyPlan] = useState('');
  const [prevTherapy, setPrevTherapy] = useState({ status: '', detail: '' });
  const [medications, setMedications] = useState({ status: '', detail: '' });
  const [medConds, setMedConds] = useState({ status: '', detail: '' });
  const [substance, setSubstance] = useState({ status: '', detail: '' });
  const [mse, setMse] = useState({});
  const [primaryDx, setPrimaryDx] = useState('');
  const [secondaryDx, setSecondaryDx] = useState('');
  const [zCodes, setZCodes] = useState('');
  const [conceptualization, setConceptualization] = useState('');
  const [modality, setModality] = useState([]);
  const [frequency, setFrequency] = useState('');
  const [txDuration, setTxDuration] = useState('');
  const [referrals, setReferrals] = useState([]);

  const toggleModality = (m) => setModality(prev => prev.includes(m) ? prev.filter(x=>x!==m) : [...prev,m]);
  const toggleReferral = (r) => setReferrals(prev => prev.includes(r) ? prev.filter(x=>x!==r) : [...prev,r]);
  const fmt = (item) => !item.status ? '' : item.status + (item.detail ? ': ' + item.detail : '');

  const generate = async () => {
    if (loading) return;
    if (!symptoms.trim()) { showToast('Add presenting symptoms first'); return; }
    const key = apiKeyRef.current;
    if (!key) { onNeedKey(); return; }
    setLoading(true); setNote('');
    // Every free-text field is de-identified on-device before it reaches the prompt.
    const functioning = { occupational: fmt(occ), social: fmt(soc), adl: fmt(adl) };
    const safety = { si: fmt(si), hi: fmt(hi), selfHarm: fmt(selfHarm), safetyPlan };
    const history = { prevTherapy: fmt(prevTherapy), medications: fmt(medications), medConditions: fmt(medConds), substance: fmt(substance) };
    const freeText = { chiefComplaint: symptoms, onset, severity, stressors, primaryDx, secondaryDx, zCodes, conceptualization };
    const planItems = safetyPlanItems || [];
    const san = L.makeSanitizer([...Object.values(freeText), ...Object.values(functioning), ...Object.values(safety), ...Object.values(history), ...planItems.map(e => e.text)], { subject, ...privacy });
    const cleanAll = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, san.clean(v)]));
    setFlags(san);
    try {
      const raw = await callGroq(L.buildIntakePrompt({
        subject, sessionDate,
        duration: sessionStart && sessionEnd && sessionDuration ? `${fmtTime12(sessionStart)} to ${fmtTime12(sessionEnd)} (${sessionDuration} minutes)` : '',
        ...cleanAll(freeText),
        functioning: cleanAll(functioning),
        safety: cleanAll(safety),
        history: cleanAll(history),
        mseData: mse,
        treatmentModality: modality, frequency, txDuration, referrals,
        screeningScores: screeningLines || [],
        safetyPlanLines: safetyPlanToLines(planItems, san.clean),
      }), key);
      setNote(L.redactNames(L.scrubText(raw), san.names, subject));
    } catch(err) {
      showToast(err.message.startsWith('invalid_key') ? 'Groq rejected the key — get a free key at console.groq.com' : (err.message || 'Generation failed'), true);
    } finally { setLoading(false); }
  };

  const copyNote = async () => {
    try { await navigator.clipboard.writeText(note); showToast('Copied to clipboard'); }
    catch { showToast('Copy failed — select and copy manually'); }
  };

  const INTAKE_HEADINGS = ['Identifying Information','Chief Complaint','History of Presenting Illness','Safety Assessment','Medical and Psychiatric History','Mental Status Examination','Clinical Impressions and Diagnosis','Treatment Recommendations'];
  const parseIntakeNote = (text) => {
    const pat = new RegExp('(' + INTAKE_HEADINGS.map(h => h.replace(/[()]/g,'\\$&')).join('|') + '):', 'i');
    const tokens = text.split(pat).filter(Boolean);
    const out = [];
    for (let i = 0; i < tokens.length; i++) {
      const t = tokens[i].trim();
      if (INTAKE_HEADINGS.some(h => h.toLowerCase() === t.toLowerCase())) {
        out.push({ heading: t, body: (tokens[i+1]||'').trim() }); i++;
      } else if (!out.length && t) { out.push({ heading: null, body: t }); }
    }
    return out.length ? out : [{ heading: null, body: text.trim() }];
  };
  const sections = note ? parseIntakeNote(note) : [];

  const StatusSeg = ({ value, onChange, opts }) => (
    <div className="tri-seg">
      {opts.map(o => <button key={o} type="button" aria-pressed={value===o} onClick={()=>onChange(value===o?'':o)}>{o}</button>)}
    </div>
  );
  const StatusRow = ({ label, item, setItem, opts, detailPh, showOn }) => (
    <div className="row" style={{marginBottom:8}}>
      <label style={{marginBottom:4}}>{label}</label>
      <StatusSeg value={item.status} onChange={s=>setItem(x=>({...x,status:s}))} opts={opts}/>
      {showOn && showOn.includes(item.status) && <input className="input inline-detail" placeholder={detailPh||'Detail…'} value={item.detail} onChange={e=>setItem(x=>({...x,detail:e.target.value}))}/>}
    </div>
  );

  return (
    <>
      <aside className="sidebar">
        <div className="card">
          <h3>Session info <span className="hint">CPT 90791</span></h3>
          <div className="row">
            <label>Refer to subject as</label>
            <div className="seg">
              <button type="button" aria-pressed={subject==='Client'} onClick={()=>setSubject('Client')}>Client</button>
              <button type="button" aria-pressed={subject==='Patient'} onClick={()=>setSubject('Patient')}>Patient</button>
            </div>
          </div>
          <div className="row">
            <label>Session date</label>
            <input className="input" type="date" value={sessionDate} onChange={e=>setSessionDate(e.target.value)}/>
          </div>
          <div className="row" style={{marginBottom:0}}>
            <label>Session time</label>
            <div style={{display:'flex',gap:10,alignItems:'flex-end'}}>
              <div style={{flex:1}}>
                <div style={{fontSize:11.5,color:'var(--muted)',marginBottom:4}}>Start</div>
                <input className="input" type="time" value={sessionStart} onChange={e=>setSessionStart(e.target.value)}/>
              </div>
              <span style={{color:'var(--muted)',fontSize:13,paddingBottom:9,flexShrink:0}}>to</span>
              <div style={{flex:1}}>
                <div style={{fontSize:11.5,color:'var(--muted)',marginBottom:4}}>End</div>
                <input className="input" type="time" value={sessionEnd} onChange={e=>setSessionEnd(e.target.value)}/>
              </div>
            </div>
            {sessionDuration !== null && (
              <div style={{marginTop:8,fontSize:13,color:'var(--ok)',fontWeight:500}}>
                {fmtTime12(sessionStart)} – {fmtTime12(sessionEnd)} &nbsp;·&nbsp; {sessionDuration} minutes
              </div>
            )}
            {sessionStart && sessionEnd && sessionDuration === null && (
              <div style={{marginTop:6,fontSize:12,color:'var(--danger)'}}>End time must be after start time</div>
            )}
          </div>
        </div>

        <div className="card">
          <h3>Chief complaint <span className="hint">Required</span></h3>
          <div className="row">
            <label>Presenting symptoms</label>
            <textarea className="textarea" rows="4" placeholder="Describe the client's reported symptoms…" value={symptoms} onChange={e=>setSymptoms(e.target.value)}/>
          </div>
          <div className="row">
            <label>Onset & duration</label>
            <input className="input" type="text" placeholder="e.g. 6 months, since job loss" value={onset} onChange={e=>setOnset(e.target.value)}/>
          </div>
          <div className="row">
            <label>Frequency & severity (1–10)</label>
            <input className="input" type="text" placeholder="e.g. daily, severity 7/10" value={severity} onChange={e=>setSeverity(e.target.value)}/>
          </div>
          <div className="row" style={{marginBottom:0}}>
            <label>Precipitating stressors</label>
            <textarea className="textarea" rows="2" placeholder="e.g. recent divorce, job loss" value={stressors} onChange={e=>setStressors(e.target.value)}/>
          </div>
        </div>

        <div className="card">
          <h3>Functional impact <span className="hint">HPI</span></h3>
          <StatusRow label="Occupational / educational" item={occ} setItem={setOcc} opts={['Intact','Impaired']} showOn={['Impaired']} detailPh="Describe impairment…"/>
          <StatusRow label="Social / interpersonal" item={soc} setItem={setSoc} opts={['Intact','Impaired']} showOn={['Impaired']} detailPh="Describe impairment…"/>
          <StatusRow label="Activities of daily living" item={adl} setItem={setAdl} opts={['Intact','Impaired']} showOn={['Impaired']} detailPh="Describe impairment…"/>
        </div>

        <div className="card">
          <h3>Safety assessment</h3>
          <StatusRow label="Suicidal ideation" item={si} setItem={setSi} opts={['Denied','Present']} showOn={['Present']} detailPh="Detail…"/>
          <StatusRow label="Homicidal ideation" item={hi} setItem={setHi} opts={['Denied','Present']} showOn={['Present']} detailPh="Detail…"/>
          <StatusRow label="Self-harm history" item={selfHarm} setItem={setSelfHarm} opts={['Denied','Present']} showOn={['Present']} detailPh="Detail…"/>
          <div className="row" style={{marginBottom:0}}>
            <label>Safety plan</label>
            <div className="tri-seg">
              {['Not required','Completed'].map(o => <button key={o} type="button" aria-pressed={safetyPlan===o} onClick={()=>setSafetyPlan(safetyPlan===o?'':o)}>{o}</button>)}
            </div>
          </div>
        </div>

        <div className="card">
          <h3>Medical & psychiatric history</h3>
          <StatusRow label="Previous therapy / psychiatric care" item={prevTherapy} setItem={setPrevTherapy} opts={['None','Prior']} showOn={['Prior']} detailPh="Provider, dates, reason…"/>
          <StatusRow label="Current psychiatric medications" item={medications} setItem={setMedications} opts={['None','List']} showOn={['List']} detailPh="Medication, dose…"/>
          <StatusRow label="Relevant medical conditions" item={medConds} setItem={setMedConds} opts={['None','List']} showOn={['List']} detailPh="Condition, treatment…"/>
          <StatusRow label="Substance use" item={substance} setItem={setSubstance} opts={['Denies','Current','Past']} showOn={['Current','Past']} detailPh="Substance, frequency, last use…"/>
        </div>

        <div className="card">
          <h3>Mental status exam <span className="hint">Quick fill</span></h3>
          <div className="mse">
            {L.MSE_FIELDS.map(f => (
              <div className="mse-cell" key={f.key}>
                <label>{f.label}</label>
                <select className="select" value={mse[f.key]||''} onChange={e=>setMse(m=>({...m,[f.key]:e.target.value}))}>
                  {f.options.map(o => <option key={o} value={o}>{o||'—'}</option>)}
                </select>
              </div>
            ))}
          </div>
        </div>

        <div className="card">
          <h3>Diagnostic summary</h3>
          <div className="row">
            <label>Primary diagnosis (DSM-5-TR / ICD-10)</label>
            <DxAutocompleteInput placeholder="e.g. anxiety, F41.1, depression, PTSD…" onChange={setPrimaryDx}/>
          </div>
          <div className="row">
            <label>Secondary diagnosis</label>
            <DxAutocompleteInput placeholder="Optional secondary diagnosis…" onChange={setSecondaryDx}/>
          </div>
          <div className="row">
            <label>Z-codes (social determinants)</label>
            <input className="input" type="text" placeholder="e.g. Z56.0, Z63.0" value={zCodes} onChange={e=>setZCodes(e.target.value)}/>
          </div>
          <div className="row" style={{marginBottom:0}}>
            <label>Case conceptualization</label>
            <textarea className="textarea" rows="3" placeholder="Brief clinical formulation…" value={conceptualization} onChange={e=>setConceptualization(e.target.value)}/>
          </div>
        </div>

        <div className="card">
          <h3>Treatment recommendations</h3>
          <div className="row">
            <label>Modality</label>
            <div className="chk-row">
              {['Individual Therapy','Family Therapy','Group Therapy'].map(m => (
                <button key={m} type="button" className="chk-btn" aria-pressed={modality.includes(m)} onClick={()=>toggleModality(m)}>{m}</button>
              ))}
            </div>
          </div>
          <div className="row">
            <label>Frequency</label>
            <div className="tri-seg">
              {['Weekly','Bi-weekly','As needed'].map(f => <button key={f} type="button" aria-pressed={frequency===f} onClick={()=>setFrequency(frequency===f?'':f)}>{f}</button>)}
            </div>
          </div>
          <div className="row">
            <label>Duration</label>
            <div className="tri-seg">
              {['3 Months','6 Months','Ongoing'].map(d => <button key={d} type="button" aria-pressed={txDuration===d} onClick={()=>setTxDuration(txDuration===d?'':d)}>{d}</button>)}
            </div>
          </div>
          <div className="row" style={{marginBottom:0}}>
            <label>Referrals</label>
            <div className="chk-row">
              {['Refer for therapy','Refer to Psychiatrist for evaluation'].map(r => (
                <button key={r} type="button" className="chk-btn" aria-pressed={referrals.includes(r)} onClick={()=>toggleReferral(r)}>{r}</button>
              ))}
            </div>
          </div>
        </div>
        {screeningLines && screeningLines.length > 0 && (
          <div className="card" style={{marginTop:0}}>
            <h3>Screenings <span className="hint">included in generated note</span></h3>
            {screeningLines.map((l,i) => <div key={i} style={{fontSize:12.5,color:'var(--ink-2)',marginBottom:4}}>{l}</div>)}
          </div>
        )}
      </aside>

      <main className="main" id="intake-pane">
        <div className="note-toolbar">
          <div className="left">{note && <span style={{fontSize:12}}>Intake note generated · CPT 90791</span>}</div>
          <div className="actions">
            <button className="btn" disabled={!note||loading} onClick={copyNote}><Icon.copy/>Copy</button>
            <button className="btn primary" disabled={loading} onClick={generate}>
              {loading ? <span className="spin"/> : <Icon.spark/>}
              {loading ? 'Generating…' : note ? 'Regenerate' : 'Generate intake note'}
            </button>
          </div>
        </div>
        <RedactionFlags flags={flags}/>
        <article className={`paper ${loading?'loading':''}`}>
          {note ? (
            <div className="note-output">
              {sections.map((s,i) => (
                <div key={i}>
                  {s.heading && <h2 className="note-section">{s.heading}</h2>}
                  {(s.body||'').split(/\n{2,}/).map((para,j) => (
                    <p key={j}>{para.split('\n').map((line,k) => (
                      <React.Fragment key={k}>{line}{k<para.split('\n').length-1&&<br/>}</React.Fragment>
                    ))}</p>
                  ))}
                </div>
              ))}
            </div>
          ) : loading ? (
            <>
              <div className="meta"><span className="fmt">Drafting intake note…</span><span>Writer</span></div>
              {[0,1,2,3,4,5,6].map(i=><div className="gen-line" key={i} style={{width:`${58+(i*9)%36}%`}}/>)}
            </>
          ) : (
            <div className="empty">
              <div className="icon"><Icon.page/></div>
              <h4>Intake note will appear here</h4>
              <div>Complete the form on the left, then press Generate intake note.</div>
            </div>
          )}
        </article>
      </main>
    </>
  );
}

const _chkSvg = (
  <svg width="10" height="8" viewBox="0 0 10 8" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M1 4L3.5 6.5L9 1" stroke="white" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);

const SxItem = React.memo(function SxItem({ criterion, itemKey, checked, onToggle, onCtxChange }) {
  const [localCtx, setLocalCtx] = useState('');
  const handleCtxChange = useCallback((e) => {
    const val = e.target.value;
    setLocalCtx(val);
    onCtxChange(itemKey, val);
  }, [itemKey, onCtxChange]);
  return (
    <div className={`sx-item${checked ? ' checked' : ''}`}>
      <button type="button" className="sx-check" onClick={() => onToggle(itemKey)}>
        <span className="sx-chk-box">{checked && _chkSvg}</span>
        <span className="sx-chk-lbl">{criterion}</span>
      </button>
      {checked && (
        <div className="sx-ctx">
          <textarea
            className="textarea"
            rows="2"
            placeholder="Add clinical specifics or context (optional)…"
            value={localCtx}
            onChange={handleCtxChange}
          />
        </div>
      )}
    </div>
  );
});

function DxTab({ apiKeyRef, showToast, onNeedKey, privacy }) {
  const [subject, setSubject] = useState('Client');
  const [dxQuery, setDxQuery] = useState('');
  const [showDrop, setShowDrop] = useState(false);
  const [focusedIdx, setFocusedIdx] = useState(-1);
  const [selectedDx, setSelectedDx] = useState(null);
  // checkedSet keys are "groupIdx:criteriaIdx" strings
  const [checkedSet, setCheckedSet] = useState(new Set());
  // ctxMap stored as a ref — context edits don't need to re-render DxTab
  const ctxMapRef = useRef({});
  const [observations, setObservations] = useState('');
  const [note, setNote] = useState('');
  const [loading, setLoading] = useState(false);
  const [flags, setFlags] = useState(null);
  const acWrapRef = useRef(null);

  const filtered = useMemo(() => {
    if (!dxQuery.trim() || selectedDx) return [];
    const q = dxQuery.toLowerCase();
    return L.DX_DATABASE.filter(d => d.code.toLowerCase().includes(q) || d.name.toLowerCase().includes(q)).slice(0, 9);
  }, [dxQuery, selectedDx]);

  useEffect(() => {
    const handler = (e) => { if (acWrapRef.current && !acWrapRef.current.contains(e.target)) setShowDrop(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const selectDx = useCallback((dx) => {
    setSelectedDx(dx);
    setDxQuery(`${dx.code} — ${dx.name}`);
    setShowDrop(false);
    setFocusedIdx(-1);
    setCheckedSet(new Set());
    ctxMapRef.current = {};
    setNote('');
  }, []);

  const clearDx = useCallback(() => {
    setSelectedDx(null);
    setDxQuery('');
    setShowDrop(false);
    setCheckedSet(new Set());
    ctxMapRef.current = {};
    setNote('');
  }, []);

  const toggleSymptom = useCallback((key) => {
    setCheckedSet(prev => { const n = new Set(prev); n.has(key) ? n.delete(key) : n.add(key); return n; });
  }, []);

  const setCtx = useCallback((key, val) => {
    ctxMapRef.current = { ...ctxMapRef.current, [key]: val };
  }, []);

  const generate = async () => {
    if (loading) return;
    if (!selectedDx) { showToast('Select a diagnosis first'); return; }
    if (checkedSet.size === 0) { showToast('Select at least one presenting symptom'); return; }
    const key = apiKeyRef.current;
    if (!key) { onNeedKey(); return; }
    setLoading(true); setNote('');
    try {
      const selectedSymptoms = [];
      selectedDx.groups.forEach((group, gIdx) => {
        group.criteria.forEach((crit, cIdx) => {
          const k = `${gIdx}:${cIdx}`;
          if (checkedSet.has(k)) selectedSymptoms.push({ label: crit, context: ctxMapRef.current[k] || '' });
        });
      });
      const diagnosis = `${selectedDx.code} — ${selectedDx.name}`;
      // Criteria labels come from DX_DATABASE; only the Writer's own text needs de-identifying.
      const san = L.makeSanitizer([...selectedSymptoms.map(s => s.context), observations], { subject, ...privacy });
      setFlags(san);
      const cleanSymptoms = selectedSymptoms.map(s => ({ ...s, context: san.clean(s.context) }));
      const raw = await callGroq(L.buildDxPrompt({ subject, diagnosis, selectedSymptoms: cleanSymptoms, observations: san.clean(observations) }), key);
      setNote(L.redactNames(L.scrubText(raw), san.names, subject));
    } catch(err) {
      showToast(err.message.startsWith('invalid_key') ? 'Groq rejected the key — get a free key at console.groq.com' : (err.message || 'Generation failed'), true);
    } finally { setLoading(false); }
  };

  const copyNote = async () => {
    try { await navigator.clipboard.writeText(note); showToast('Copied to clipboard'); }
    catch { showToast('Copy failed — select and copy manually'); }
  };

  return (
    <>
      <aside className="sidebar">
        <div className="card">
          <h3>Diagnosis <span className="hint">Required</span></h3>
          <div className="row">
            <label>Refer to subject as</label>
            <div className="seg">
              <button type="button" aria-pressed={subject==='Client'} onClick={()=>setSubject('Client')}>Client</button>
              <button type="button" aria-pressed={subject==='Patient'} onClick={()=>setSubject('Patient')}>Patient</button>
            </div>
          </div>
          <div className="row" style={{marginBottom:0}}>
            <label>Search by name or ICD-10 code</label>
            <div className="dx-ac-wrap" ref={acWrapRef}>
              <div style={{position:'relative',display:'flex',alignItems:'center'}}>
                <input
                  className="input"
                  type="text"
                  placeholder="e.g. anxiety, F41.1, depression, PTSD…"
                  value={dxQuery}
                  autoComplete="off"
                  spellCheck={false}
                  style={selectedDx ? {paddingRight:32,background:'var(--accent-soft)',borderColor:'var(--accent)',fontWeight:500} : {}}
                  readOnly={!!selectedDx}
                  onFocus={() => { if (!selectedDx && filtered.length) setShowDrop(true); }}
                  onChange={e => { setDxQuery(e.target.value); setShowDrop(true); setFocusedIdx(-1); }}
                  onKeyDown={e => {
                    if (e.key === 'Escape') { setShowDrop(false); return; }
                    if (!showDrop || !filtered.length) return;
                    if (e.key === 'ArrowDown') { e.preventDefault(); setFocusedIdx(i => Math.min(i+1, filtered.length-1)); }
                    else if (e.key === 'ArrowUp') { e.preventDefault(); setFocusedIdx(i => Math.max(i-1, 0)); }
                    else if (e.key === 'Enter' && focusedIdx >= 0) { e.preventDefault(); selectDx(filtered[focusedIdx]); }
                  }}
                />
                {selectedDx && (
                  <button
                    type="button"
                    onClick={clearDx}
                    title="Clear selection"
                    style={{position:'absolute',right:8,background:'none',border:'none',cursor:'pointer',color:'var(--accent)',fontSize:15,lineHeight:1,padding:'2px 4px',borderRadius:4,display:'flex',alignItems:'center'}}
                  >✕</button>
                )}
              </div>
              {showDrop && filtered.length > 0 && (
                <div className="dx-ac-drop">
                  {filtered.map((dx, i) => (
                    <div
                      key={dx.code}
                      className={`dx-ac-item${i === focusedIdx ? ' focused' : ''}`}
                      onMouseDown={e => { e.preventDefault(); selectDx(dx); }}
                    >
                      <span className="dx-code">{dx.code}</span>
                      <span className="dx-name">{dx.name}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>

        {selectedDx && (
          <div className="card">
            <h3>
              Presenting symptoms
              <span className="hint">{checkedSet.size > 0 ? `${checkedSet.size} selected` : 'Select all that apply'}</span>
            </h3>
            <div className="note-sm" style={{marginBottom:12}}>Check each symptom present, then add clinical context in the box that appears. Badges show DSM-5-TR minimums.</div>
            {selectedDx.groups.map((group, gIdx) => {
              const groupCount = group.criteria.filter((_, cIdx) => checkedSet.has(`${gIdx}:${cIdx}`)).length;
              const isMet = groupCount >= group.min;
              const hasAny = groupCount > 0;
              return (
                <div key={gIdx} className="sx-group">
                  <div className="sx-group-hd">
                    <span className="sx-group-label">{group.label}</span>
                    <span className={`sx-group-badge${isMet ? ' met' : hasAny ? ' partial' : ''}`}>
                      {groupCount} / {group.min} min
                    </span>
                  </div>
                  {group.note && <div className="sx-group-note">{group.note}</div>}
                  <div className="sx-list">
                    {group.criteria.map((criterion, cIdx) => {
                      const k = `${gIdx}:${cIdx}`;
                      return (
                        <SxItem
                          key={k}
                          criterion={criterion}
                          itemKey={k}
                          checked={checkedSet.has(k)}
                          onToggle={toggleSymptom}
                          onCtxChange={setCtx}
                        />
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        <div className="card">
          <h3>Clinical observations <span className="hint">Optional</span></h3>
          <textarea className="textarea" rows="4" placeholder="MSE findings, mood, affect, behavior relevant to the diagnosis…" value={observations} onChange={e=>setObservations(e.target.value)}/>
          <div className="note-sm" style={{marginTop:8}}>Only what is provided here will be included. Leave blank to omit.</div>
        </div>
      </aside>

      <main className="main">
        <div className="note-toolbar">
          <div className="left">{note && <span style={{fontSize:12}}>Diagnostic justification generated</span>}</div>
          <div className="actions">
            <button className="btn" disabled={!note||loading} onClick={copyNote}><Icon.copy/>Copy</button>
            <button className="btn primary" disabled={loading} onClick={generate}>
              {loading ? <span className="spin"/> : <Icon.spark/>}
              {loading ? 'Generating…' : note ? 'Regenerate' : 'Generate statement'}
            </button>
          </div>
        </div>
        <RedactionFlags flags={flags}/>
        <article className={`paper ${loading?'loading':''}`} style={{padding:'40px 48px'}}>
          {note ? (
            <div style={{fontFamily:'var(--serif)',fontSize:'16px',lineHeight:1.85,color:'var(--ink)',maxWidth:620}}>
              <div style={{fontSize:10.5,fontFamily:'var(--sans)',letterSpacing:'.06em',textTransform:'uppercase',color:'var(--muted)',fontWeight:600,marginBottom:20,borderBottom:'1px solid var(--line)',paddingBottom:10}}>
                Diagnostic Justification — {selectedDx ? `${selectedDx.code} ${selectedDx.name}` : ''}
              </div>
              <p style={{margin:0,whiteSpace:'pre-wrap'}}>{note}</p>
            </div>
          ) : loading ? (
            <>
              <div className="meta"><span className="fmt">Drafting statement…</span><span>Writer</span></div>
              {[0,1,2].map(i=><div className="gen-line" key={i} style={{width:`${68+(i*12)%28}%`}}/>)}
            </>
          ) : (
            <div className="empty">
              <div className="icon"><Icon.page/></div>
              <h4>Justification statement will appear here</h4>
              <div>Search for a diagnosis, select presenting symptoms, then press Generate statement.</div>
            </div>
          )}
        </article>
      </main>
    </>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    const html = document.documentElement;
    html.className = html.className.replace(/\btheme-\S+/g,'').replace(/\bdensity-\S+/g,'').trim();
    html.classList.add(`theme-${tweaks.theme}`);
    html.classList.add(`density-${tweaks.density}`);
  }, [tweaks.theme, tweaks.density]);

  const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem('pn.apikey') || ''; } catch { return ''; } });
  const apiKeyRef = useRef('');
  useEffect(() => { apiKeyRef.current = apiKey; }, [apiKey]);
  const [showKeyModal, setShowKeyModal] = useState(false);
  const pendingGenRef = useRef(false);
  const saveApiKey = (key) => {
    apiKeyRef.current = key;
    setApiKey(key);
    try { localStorage.setItem('pn.apikey', key); } catch {}
    setShowKeyModal(false);
    if (pendingGenRef.current) { pendingGenRef.current = false; setTimeout(() => generateRef.current(), 0); }
  };
  const removeApiKey = () => { apiKeyRef.current = ''; setApiKey(''); try { localStorage.removeItem('pn.apikey'); } catch {} setShowKeyModal(false); };
  const generateRef = useRef(null);

  const [appMode, setAppMode] = useState('progress');
  const [format, setFormat] = useState('soap');
  const [subject, setSubject] = useState('Client');
  const [tone, setTone] = useState('balanced');
  const [conciseness, setConciseness] = useState('standard');
  const [voiceOn, setVoiceOn] = useState(false);
  const [voiceStrength, setVoiceStrength] = useState(50);
  const [inputMode, setInputMode] = useState('free');
  const [freeText, setFreeText] = useState('');
  const [structured, setStructured] = useState({ presenting:'', content:'', interventionsText:'', response:'', plan:'' });
  const [bullets, setBullets] = useState('');
  const [interventions, setInterventions] = useState([]);
  const [otherIntervention, setOtherIntervention] = useState('');
  const [mse, setMse] = useState({});
  const [risk, setRisk] = useState(L.RISK_ITEMS.reduce((acc,r) => { acc[r.key]={status:null,note:''}; return acc; }, {}));
  const [note, setNote] = useState('');
  const [loading, setLoading] = useState(false);
  const [nameFlags, setNameFlags] = useState([]);
  const [phiFlags, setPhiFlags] = useState([]);
  const [generatedMeta, setGeneratedMeta] = useState(null);
  const [safeHarbor, setSafeHarbor] = useState(true);
  const [allowlist, setAllowlist] = useState(() => { try { return JSON.parse(localStorage.getItem('pn.allowlist') || '[]'); } catch { return []; } });
  const addAllowedWord = (w) => { const next = [...allowlist, w]; setAllowlist(next); try { localStorage.setItem('pn.allowlist', JSON.stringify(next)); } catch {} };
  const privacy = useMemo(() => ({ allowlist, safeHarbor }), [allowlist, safeHarbor]);
  const removeAllowedWord = (w) => { const next = allowlist.filter(x => x !== w); setAllowlist(next); try { localStorage.setItem('pn.allowlist', JSON.stringify(next)); } catch {} };
  const [confirming, setConfirming] = useState(false);
  const [sessionDate, setSessionDate] = useState('');
  const [sessionStart, setSessionStart] = useState('');
  const [sessionEnd, setSessionEnd] = useState('');
  const [sessionLocation, setSessionLocation] = useState('In-Office (POS 11)');
  const [sessionCredentials, setSessionCredentials] = useState('');
  const [goals, setGoals] = useState([]);
  const [screeningAnswers, setScreeningAnswers] = useState({});
  const [safetyPlan, setSafetyPlan] = useState(EMPTY_SAFETY_PLAN);
  // Bumped by wipeAll to remount the tabs that keep their drafts in local state.
  const [resetKey, setResetKey] = useState(0);
  const safetyPlanItems = useMemo(() => safetyPlanEntries(safetyPlan), [safetyPlan]);
  const sessionDuration = useMemo(() => {
    if (!sessionStart || !sessionEnd) return null;
    const [sh, sm] = sessionStart.split(':').map(Number);
    const [eh, em] = sessionEnd.split(':').map(Number);
    const diff = (eh * 60 + em) - (sh * 60 + sm);
    return diff > 0 ? diff : null;
  }, [sessionStart, sessionEnd]);

  useEffect(() => {
    try { localStorage.removeItem('pn.drafts'); } catch {}
    try { localStorage.removeItem('pn.groqmodel'); } catch {}
  }, []);
  const [toast, showToast] = useToast();

  const appendTranscript = useCallback((text) => {
    setFreeText(prev => prev ? prev + ' ' + text : text);
  }, []);
  const stt = useSpeechRecognition(appendTranscript);

  const rawInput = useMemo(() => {
    if (inputMode==='free') return freeText;
    if (inputMode==='bullets') return bullets;
    return Object.values(structured).join(' \n');
  }, [inputMode, freeText, bullets, structured]);

  const detectedNames = useMemo(() => L.detectNames(rawInput, [], allowlist), [rawInput, allowlist]);
  const detectedPHI = useMemo(() => safeHarbor ? L.detectPHI(rawInput) : [], [rawInput, safeHarbor]);

  const generate = async () => {
    if (loading) return;
    if (!rawInput.trim()) { showToast('Add some session content first'); return; }
    const key = apiKeyRef.current;
    if (!key) { pendingGenRef.current = true; setShowKeyModal(true); return; }
    pendingGenRef.current = false;
    // Active treatment goals also go into the prompt, so names in them are redacted too.
    const activeGoals = goals.filter(g => g.status === 'active' && g.text.trim());
    // So do safety plan lines.
    const extraTexts = [...activeGoals.map(g => g.text), ...safetyPlanItems.map(e => e.text)];
    const allNames = Array.from(new Set([...detectedNames, ...extraTexts.flatMap(t => L.detectNames(t, [], allowlist))]));
    const goalPHI = safeHarbor ? extraTexts.flatMap(t => L.detectPHI(t)) : [];
    setLoading(true); setNote(''); setGeneratedMeta(null); setNameFlags(allNames); setPhiFlags([...detectedPHI, ...goalPHI]);
    const sanitize = (s) => { let o = L.redactNames(s, allNames, subject); if (safeHarbor) o = L.redactPHI(o); return o; };
    const truncate = (s, max = 2500) => s.length > max ? s.slice(0, max) + '…' : s;
    const prompt = L.buildPrompt({
      format, tone, subject, conciseness, voiceMode: voiceOn, voiceStrength, inputMode,
      freeText: truncate(sanitize(freeText)),
      structured: Object.fromEntries(Object.entries(structured).map(([k,v])=>[k,truncate(sanitize(v), 600)])),
      bullets: truncate(sanitize(bullets)),
      interventions: [...interventions, ...otherIntervention.split(',').map(s=>s.trim()).filter(Boolean)],
      mse, risk, redactedNames: allNames,
      sessionDate,
      sessionStart: sessionStart ? fmtTime12(sessionStart) : '',
      sessionEnd: sessionEnd ? fmtTime12(sessionEnd) : '',
      sessionDuration,
      sessionLocation,
      sessionCredentials,
      screeningScores: screeningLines,
      activeGoals: activeGoals.map(g => ({ ...g, text: sanitize(g.text) })),
      safetyPlanLines: safetyPlanToLines(safetyPlanItems, sanitize),
    });
    try {
      const raw = await callGroq(prompt, key);
      const cleaned = L.scrubText(raw);
      setNote(L.redactNames(cleaned, allNames, subject));
      setGeneratedMeta({ format, subject, tone, at: new Date() });
    } catch(err) {
      if (err.message.startsWith('invalid_key')) {
        const detail = err.message.slice('invalid_key:'.length);
        showToast('Groq rejected the key (401)' + (detail ? ': ' + detail : '') + ' — get a free API key at console.groq.com → API Keys.', true);
      } else {
        showToast(err.message || 'Generation failed. Try again.', true);
      }
    } finally { setLoading(false); }
  };
  useEffect(() => { generateRef.current = generate; });

  const screeningLines = useMemo(() => {
    const lines = [];
    Object.values(SCREENING_TOOLS).forEach(tool => {
      const r = screeningResult(tool, screeningAnswers[tool.key] || {});
      if (r.complete) lines.push(`${tool.label}: ${r.summary}`);
    });
    return lines;
  }, [screeningAnswers]);

  const copyNote = async () => {
    if (!note) return;
    try { await navigator.clipboard.writeText(note); showToast('Copied to clipboard'); }
    catch { showToast('Copy failed — please select and copy manually'); }
  };

  const wipeAll = () => {
    setNote(''); setGeneratedMeta(null); setNameFlags([]); setPhiFlags([]);
    setFreeText(''); setBullets('');
    setStructured({ presenting:'', content:'', interventionsText:'', response:'', plan:'' });
    setVoiceOn(false); setInterventions([]); setOtherIntervention('');
    setSessionDate(''); setSessionStart(''); setSessionEnd(''); setSessionLocation('In-Office (POS 11)'); setSessionCredentials('');
    setMse({}); setRisk(L.RISK_ITEMS.reduce((acc,r)=>{ acc[r.key]={status:null,note:''}; return acc; },{}));
    // Clear everything entered for this client. Intake, Dx, Treatment Plan and Screenings keep
    // drafts in their own state, so remount them with a new key.
    setSafetyPlan(EMPTY_SAFETY_PLAN); setScreeningAnswers({}); setGoals([]); setResetKey(k => k + 1);
    setConfirming(false); try { localStorage.removeItem('pn.drafts'); } catch {}
    showToast('Everything erased');
  };

  const sections = useMemo(() => { if (!note) return []; return L.parseNote(note, generatedMeta?.format || format); }, [note, format, generatedMeta]);
  const toggleIntervention = (name) => setInterventions(prev => prev.includes(name) ? prev.filter(x=>x!==name) : [...prev,name]);
  const ToneControl = tweaks.toneStyle==='dial' ? ToneDial : tweaks.toneStyle==='stacked' ? ToneStacked : ToneSegmented;
  const openTweaks = () => window.postMessage({ type: '__activate_edit_mode' }, '*');
  const totalInterventions = interventions.length + otherIntervention.split(',').map(s=>s.trim()).filter(Boolean).length;

  return (
    <div className="app">
      <header className="topbar">
        <div className="brand">
          <div className="mark"/>
          <h1>Progress Note Writer</h1>
          <span className="tag">De-identified · for Writers</span>
        </div>
        <div className="mode-sel" role="tablist">
          <button type="button" role="tab" aria-pressed={appMode==='progress'} onClick={()=>setAppMode('progress')}>Progress Note</button>
          <button type="button" role="tab" aria-pressed={appMode==='intake'} onClick={()=>setAppMode('intake')}>Intake Assessment</button>
          <button type="button" role="tab" aria-pressed={appMode==='dx'} onClick={()=>setAppMode('dx')}>Dx Justification</button>
          <button type="button" role="tab" aria-pressed={appMode==='plan'} onClick={()=>setAppMode('plan')}>Treatment Plan</button>
          <button type="button" role="tab" aria-pressed={appMode==='screenings'} onClick={()=>setAppMode('screenings')}>Screenings</button>
          <button type="button" role="tab" aria-pressed={appMode==='safety'} onClick={()=>setAppMode('safety')}>Safety Plan</button>
        </div>
        <div className="meta">
          <span className="hipaa-badge" title="HIPAA Safe Harbor de-identification runs on-device before any content is sent to the AI.">
            <Icon.shield/>HIPAA Safe Harbor
          </span>
          <span><span className="dot"/>Nothing saved · in-memory only</span>
          <button className={apiKey ? 'btn ghost' : 'btn'} style={{padding:'4px 10px',fontSize:11.5,height:'auto'}} onClick={() => setShowKeyModal(true)} title={apiKey ? 'Groq API key configured — click to update' : 'Enter your free Groq API key'}>
            <Icon.key/>{apiKey ? 'Groq key ✓' : 'Set Groq key'}
          </button>
          <button className="btn ghost" style={{padding:'4px 8px',fontSize:11.5,height:'auto'}} onClick={openTweaks} title="Appearance settings">
            <Icon.sliders/>
          </button>
        </div>
      </header>

      {/* These tabs stay mounted while hidden so their drafts survive tab switches. */}
      <div style={{display: appMode === 'intake' ? 'contents' : 'none'}}><IntakeTab key={resetKey} apiKeyRef={apiKeyRef} showToast={showToast} onNeedKey={()=>setShowKeyModal(true)} screeningLines={screeningLines} safetyPlanItems={safetyPlanItems} privacy={privacy}/></div>
      <div style={{display: appMode === 'dx' ? 'contents' : 'none'}}><DxTab key={resetKey} apiKeyRef={apiKeyRef} showToast={showToast} onNeedKey={()=>setShowKeyModal(true)} privacy={privacy}/></div>
      <div style={{display: appMode === 'plan' ? 'contents' : 'none'}}><TreatmentPlanTab key={resetKey} goals={goals} setGoals={setGoals} apiKeyRef={apiKeyRef} showToast={showToast} screeningLines={screeningLines} safetyPlanItems={safetyPlanItems} privacy={privacy}/></div>
      {appMode === 'safety' && <SafetyPlanTab safetyPlan={safetyPlan} setSafetyPlan={setSafetyPlan} showToast={showToast}/>}
      <div style={{display: appMode === 'screenings' ? 'contents' : 'none'}}><ScreeningsTab key={resetKey} screeningAnswers={screeningAnswers} setScreeningAnswers={setScreeningAnswers} showToast={showToast}/></div>
      {appMode === 'progress' && <aside className="sidebar">
        <div className="card hipaa-card">
          <h3>Privacy <span className="hint">HIPAA Safe Harbor</span></h3>
          <div className="hipaa-grid">
            <div className="hipaa-cell"><b>Names</b><span>auto-detected, replaced with {subject}</span></div>
            <div className="hipaa-cell"><b>SSNs · Phones · Emails</b><span>regex-redacted before send</span></div>
            <div className="hipaa-cell"><b>Dates · ZIPs · MRNs</b><span>tokenized as [TYPE-REDACTED]</span></div>
            <div className="hipaa-cell"><b>Ages 90+ · IPs · URLs</b><span>removed per §164.514(b)</span></div>
          </div>
          <div className="row h" style={{marginTop:12,marginBottom:0}}>
            <label style={{margin:0}}>Safe Harbor de-identification</label>
            <button className="tg" data-on={safeHarbor?'1':'0'} onClick={()=>setSafeHarbor(!safeHarbor)}><i/></button>
          </div>
          {safeHarbor && <AllowlistEditor words={allowlist} onAdd={addAllowedWord} onRemove={removeAllowedWord}/>}
          <div className="note-sm" style={{marginTop:8}}>Notes are never stored by this tool. Use "Note completed" to permanently erase when done. Confirm your AI provider's Business Associate Agreement before entering identifiable PHI.</div>
        </div>

        <div className="card">
          <h3>Note settings <span className="hint">Format & voice</span></h3>
          <div className="row">
            <label>Format</label>
            <select className="select" value={format} onChange={(e)=>setFormat(e.target.value)}>
              {Object.entries(L.FORMATS).map(([k,f]) => <option key={k} value={k}>{f.full}</option>)}
            </select>
          </div>
          <div className="row">
            <label>Refer to subject as</label>
            <div className="seg" role="radiogroup">
              <button type="button" aria-pressed={subject==='Client'} onClick={()=>setSubject('Client')}>Client</button>
              <button type="button" aria-pressed={subject==='Patient'} onClick={()=>setSubject('Patient')}>Patient</button>
            </div>
          </div>
          <div className="row">
            <label>Clinical tone</label>
            <ToneControl value={tone} onChange={setTone}/>
          </div>
          <div className="row">
            <label>Note length</label>
            <div className="seg" role="radiogroup">
              {Object.entries(L.CONCISENESS).map(([k,v]) => (
                <button key={k} type="button" aria-pressed={conciseness===k} onClick={()=>setConciseness(k)}>
                  {v.label}
                </button>
              ))}
            </div>
          </div>
        </div>

        <div className="card">
          <h3>Session info <span className="hint">Optional</span></h3>
          <div className="row">
            <label>Session date</label>
            <input className="input" type="date" value={sessionDate} onChange={e=>setSessionDate(e.target.value)}/>
          </div>
          <div className="row">
            <label>Session time</label>
            <div style={{display:'flex',gap:10,alignItems:'flex-end'}}>
              <div style={{flex:1}}>
                <div style={{fontSize:11.5,color:'var(--muted)',marginBottom:4}}>Start</div>
                <input className="input" type="time" value={sessionStart} onChange={e=>setSessionStart(e.target.value)}/>
              </div>
              <span style={{color:'var(--muted)',fontSize:13,paddingBottom:9,flexShrink:0}}>to</span>
              <div style={{flex:1}}>
                <div style={{fontSize:11.5,color:'var(--muted)',marginBottom:4}}>End</div>
                <input className="input" type="time" value={sessionEnd} onChange={e=>setSessionEnd(e.target.value)}/>
              </div>
            </div>
            {sessionDuration !== null && (
              <div style={{marginTop:8,fontSize:13,color:'var(--ok)',fontWeight:500}}>
                {fmtTime12(sessionStart)} – {fmtTime12(sessionEnd)} &nbsp;·&nbsp; {sessionDuration} minutes
              </div>
            )}
            {sessionStart && sessionEnd && sessionDuration === null && (
              <div style={{marginTop:6,fontSize:12,color:'var(--danger)'}}>End time must be after start time</div>
            )}
          </div>
        </div>

        <div className="card">
          <h3>Writer's voice <span className="hint">Optional</span></h3>
          <div className="row h">
            <label style={{margin:0}}>Preserve my voice</label>
            <button className="tg" data-on={voiceOn?'1':'0'} onClick={()=>setVoiceOn(!voiceOn)}><i/></button>
          </div>
          {voiceOn && (
            <div className="voice-detail">
              <div className="slider-row">
                <div className="row h" style={{margin:0}}>
                  <label style={{margin:0}}>Preservation strength</label>
                  <span className="muted" style={{fontSize:12,fontVariantNumeric:'tabular-nums'}}>{voiceStrength}%</span>
                </div>
                <input type="range" className="slider" min="0" max="100" step="5" value={voiceStrength} onChange={(e)=>setVoiceStrength(Number(e.target.value))}/>
              </div>
              <div className="note-sm" style={{marginTop:4}}>Your voice is inferred from the session content you write above — the tool mirrors your phrasing, sentence length, and word choices.</div>
            </div>
          )}
        </div>

        <div className="card">
          <h3>Session content <span className="hint">Required</span></h3>
          <div className="tabs">
            <button aria-pressed={inputMode==='free'} onClick={()=>setInputMode('free')}>Free text</button>
            <button aria-pressed={inputMode==='structured'} onClick={()=>setInputMode('structured')}>Structured</button>
            <button aria-pressed={inputMode==='bullets'} onClick={()=>setInputMode('bullets')}>Bullets</button>
          </div>
          {inputMode==='free' && (
            <div className="stt-wrap">
              <textarea className="textarea" rows="8" placeholder={`Describe the session in your own words. Mention themes, what the ${subject.toLowerCase()} discussed, interventions you used, and how they responded.`} value={freeText} onChange={(e)=>setFreeText(e.target.value)}/>
              {stt.supported && (
                <button
                  type="button"
                  className={`stt-btn${stt.active ? ' active' : ''}`}
                  onClick={stt.toggle}
                  title={stt.active ? 'Stop recording' : 'Dictate (Chrome/Edge only)'}
                >
                  <Icon.mic/>
                </button>
              )}
            </div>
          )}
          {inputMode==='structured' && (
            <>{[['presenting','Presenting issue / focus'],['content','Content discussed'],['interventionsText','Interventions used in session'],['response',`${subject}'s response`],['plan','Plan / next steps']].map(([k,label]) => (
              <div className="row" key={k}>
                <label>{label}</label>
                <textarea className="textarea" rows="2" value={structured[k]} onChange={(e)=>setStructured(s=>({...s,[k]:e.target.value}))}/>
              </div>
            ))}</>
          )}
          {inputMode==='bullets' && <textarea className="textarea" rows="8" placeholder={`- ${subject.toLowerCase()} reported low mood this week\n- explored cognitive distortions around work\n- reviewed thought record`} value={bullets} onChange={(e)=>setBullets(e.target.value)}/>}
          <div className="note-sm" style={{marginTop:10}}>Names in your input are auto-detected and replaced with {subject} before generation. Dates, places, and other context remain unless you remove them.</div>
        </div>

        <div className="card">
          <h3>Interventions <span className="hint">{totalInterventions||'none'} selected</span></h3>
          <div className="chips">
            {L.INTERVENTIONS.map(i => <button key={i} className="chip" aria-pressed={interventions.includes(i)} onClick={()=>toggleIntervention(i)}>{i}</button>)}
          </div>
          <div className="row" style={{marginTop:10,marginBottom:0}}>
            <label>Other (not listed)</label>
            <input className="input" type="text" placeholder="e.g. Somatic Experiencing, Gestalt chair work (comma-separated)" value={otherIntervention} onChange={(e)=>setOtherIntervention(e.target.value)}/>
          </div>
        </div>

        <div className="card">
          <h3>Risk assessment</h3>
          {L.RISK_ITEMS.map(({key,label}) => {
            const r = risk[key];
            const setStatus = (s) => setRisk(x=>({...x,[key]:{...x[key],status:s}}));
            const setRNote = (n) => setRisk(x=>({...x,[key]:{...x[key],note:n}}));
            return (
              <div className="risk-row" key={key}>
                <div>
                  <div className="name">{label}</div>
                  {(r.status==='endorsed'||r.status==='active') && <input className="input" style={{marginTop:6,fontSize:12,padding:'6px 9px'}} placeholder="Detail (optional)" value={r.note} onChange={(e)=>setRNote(e.target.value)}/>}
                </div>
                <div className="tri">
                  <button aria-pressed={r.status==='denied'} onClick={()=>setStatus('denied')}>Denied</button>
                  <button className="endorsed" aria-pressed={r.status==='endorsed'} onClick={()=>setStatus('endorsed')}>Endorsed</button>
                  <button className="active" aria-pressed={r.status==='active'} onClick={()=>setStatus('active')}>Active</button>
                </div>
              </div>
            );
          })}
        </div>

        <div className="card">
          <h3>Mental status exam <span className="hint">Quick fill</span></h3>
          <div className="mse">
            {L.MSE_FIELDS.map(f => (
              <div className="mse-cell" key={f.key}>
                <label>{f.label}</label>
                <select className="select" value={mse[f.key]||''} onChange={(e)=>setMse(m=>({...m,[f.key]:e.target.value}))}>
                  {f.options.map(o => <option key={o} value={o}>{o||'—'}</option>)}
                </select>
              </div>
            ))}
          </div>
        </div>
        {(screeningLines.length > 0 || safetyPlanItems.length > 0 || goals.filter(g=>g.status==='active'&&g.text.trim()).length > 0) && (
          <div className="card">
            {screeningLines.length > 0 && (
              <>
                <h3>Screenings <span className="hint">included in generated note</span></h3>
                {screeningLines.map((l,i) => <div key={i} style={{fontSize:12.5,color:'var(--ink-2)',marginBottom:4}}>{l}</div>)}
              </>
            )}
            {goals.filter(g=>g.status==='active'&&g.text.trim()).length > 0 && (
              <div style={{marginTop: screeningLines.length > 0 ? 10 : 0}}>
                <strong style={{fontSize:12.5}}>{goals.filter(g=>g.status==='active'&&g.text.trim()).length} active treatment goal{goals.filter(g=>g.status==='active'&&g.text.trim()).length!==1?'s':''}</strong>
                <span style={{fontSize:12,color:'var(--muted)'}}> referenced in note</span>
              </div>
            )}
            {safetyPlanItems.length > 0 && (
              <div style={{marginTop: screeningLines.length > 0 || goals.some(g=>g.status==='active'&&g.text.trim()) ? 10 : 0}}>
                <strong style={{fontSize:12.5}}>Safety plan: {safetyPlanItems.length} of {SAFETY_PLAN_STEPS.length} steps</strong>
                <span style={{fontSize:12,color:'var(--muted)'}}> referenced in note</span>
              </div>
            )}
          </div>
        )}
      </aside>}
      {appMode === 'progress' && <main className="main" id="note-pane">
        <div className="note-toolbar">
          <div className="left">
            {generatedMeta && <span style={{fontSize:12}}>Generated {generatedMeta.at.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}</span>}
          </div>
          <div className="actions">
            <button className="btn" disabled={!note||loading} onClick={copyNote}><Icon.copy/>Copy</button>
            <button className="btn danger" disabled={!note||loading} onClick={()=>setConfirming(true)}><Icon.check/>Note completed</button>
            <button className="btn primary" disabled={loading} onClick={generate}>
              {loading ? <span className="spin"/> : <Icon.spark/>}
              {loading ? 'Generating…' : note ? 'Regenerate note' : 'Generate note'}
            </button>
          </div>
        </div>

        {(nameFlags.length>0||phiFlags.length>0) && (
          <div className="flag-bar">
            <div style={{flex:1}}>
              <div className="lbl">De-identified before generation</div>
              <ul>
                {nameFlags.map(n=><li key={'n-'+n}>Name: {n}</li>)}
                {phiFlags.map((p,i)=><li key={'p-'+i}>{p.kind}: {p.value}</li>)}
              </ul>
            </div>
          </div>
        )}

        <article className={`paper ${loading?'loading':''}`}>
          {note ? (
            <>
              <div className="meta">
                <span className="fmt">{L.FORMATS[generatedMeta?.format||format].full}</span>
                <span>Writer · De-identified</span>
              </div>
              {sections.map((s,i) => (
                <div key={i}>
                  {s.heading && <h2 className="note-section">{s.heading}</h2>}
                  {s.body.split(/\n{2,}/).map((para,j) => (
                    <p key={j}>{para.split('\n').map((line,k) => (
                      <React.Fragment key={k}>{line}{k<para.split('\n').length-1&&<br/>}</React.Fragment>
                    ))}</p>
                  ))}
                </div>
              ))}
            </>
          ) : loading ? (
            <>
              <div className="meta"><span className="fmt">Drafting…</span><span>Writer</span></div>
              {[0,1,2,3,4,5].map(i=><div className="gen-line" key={i} style={{width:`${65+(i*7)%30}%`}}/>)}
            </>
          ) : (
            <div className="empty">
              <div className="icon"><Icon.page/></div>
              <h4>Your note will appear here</h4>
              <div>Fill in session content on the left, then press Generate note.</div>
              {!apiKey && <div style={{marginTop:16}}><button className="btn primary" onClick={()=>setShowKeyModal(true)}><Icon.key/>Set Groq key to begin</button></div>}
            </div>
          )}
        </article>
      </main>}

      <TweaksPanel title="Appearance">
        <TweakSection label="Color theme">
          <TweakSelect label="Theme" value={tweaks.theme} options={[{value:'warm',label:'Warm (default)'},{value:'cool',label:'Cool'},{value:'sage',label:'Sage'},{value:'graphite',label:'Graphite'}]} onChange={v=>setTweak('theme',v)}/>
        </TweakSection>
        <TweakSection label="Layout">
          <TweakRadio label="Density" value={tweaks.density} options={['compact','regular','comfy']} onChange={v=>setTweak('density',v)}/>
        </TweakSection>
        <TweakSection label="Tone scale style">
          <TweakSelect label="Control" value={tweaks.toneStyle} options={[{value:'segmented',label:'Segmented (default)'},{value:'dial',label:'Slider dial'},{value:'stacked',label:'Stacked cards'}]} onChange={v=>setTweak('toneStyle',v)}/>
        </TweakSection>
      </TweaksPanel>

      {toast}

      <a className="jump-fab" href="#note-pane" style={{display:'none'}} ref={(el)=>{if(!el)return;const sync=()=>{el.style.display=window.innerWidth<=900?'inline-flex':'none'};sync();window.addEventListener('resize',sync);}}>
        <Icon.page/>Jump to note
      </a>

      {confirming && (
        <div className="modal-backdrop" onClick={()=>setConfirming(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>Erase everything?</h3>
            <p>This permanently wipes the note, the session content you entered, every side-panel selection, screening answers, treatment goals, the safety plan, and any Intake, Dx or Treatment Plan drafts. Your settings and Groq key are kept. <strong>It cannot be recovered.</strong> Make sure you have already copied the note into your record before continuing.</p>
            <div className="modal-actions">
              <button className="btn" onClick={()=>setConfirming(false)}>Cancel</button>
              <button className="btn danger solid" onClick={wipeAll}>Yes, erase permanently</button>
            </div>
          </div>
        </div>
      )}

      {showKeyModal && <ApiKeyModal currentKey={apiKey} onSave={saveApiKey} onRemove={removeApiKey} onCancel={apiKey?()=>setShowKeyModal(false):null}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
